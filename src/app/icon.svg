<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Drone body -->
  <rect x="12" y="13" width="8" height="6" rx="2" fill="#2E7D9F"/>
  <!-- Camera lens -->
  <circle cx="16" cy="16" r="1.5" fill="#E8A020"/>
  <!-- Arms -->
  <line x1="12" y1="14" x2="6" y2="8" stroke="#1B3A6B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="14" x2="26" y2="8" stroke="#1B3A6B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="6" y2="24" stroke="#1B3A6B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="20" y1="18" x2="26" y2="24" stroke="#1B3A6B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Propellers -->
  <ellipse cx="6" cy="7" rx="4" ry="1.2" fill="#2E7D9F" opacity="0.7"/>
  <ellipse cx="26" cy="7" rx="4" ry="1.2" fill="#2E7D9F" opacity="0.7"/>
  <ellipse cx="6" cy="25" rx="4" ry="1.2" fill="#2E7D9F" opacity="0.7"/>
  <ellipse cx="26" cy="25" rx="4" ry="1.2" fill="#2E7D9F" opacity="0.7"/>
  <!-- Motor hubs -->
  <circle cx="6" cy="7" r="1.2" fill="#1B3A6B"/>
  <circle cx="26" cy="7" r="1.2" fill="#1B3A6B"/>
  <circle cx="6" cy="25" r="1.2" fill="#1B3A6B"/>
  <circle cx="26" cy="25" r="1.2" fill="#1B3A6B"/>
</svg>
